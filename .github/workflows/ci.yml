name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支 / PR 的新推送取消旧的运行
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: lint · typecheck · test · build
    # 本仓库分支的 PR 已经由 push 触发过一次，只给 fork 来的 PR 再跑
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # react-router-hono-server 要求 Node ≥ 24.19；bun 跑 CLI 时会用 PATH 上的 node
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # 读 packageManager 字段，和本地一致

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      # 改了 packages/db/src/schema.ts 却没生成迁移文件时失败（提示运行 bun run db:generate）
      - name: DB migrations up to date
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            git status --porcelain packages/db/drizzle
            echo "::error::schema.ts 有改动但没有对应的迁移文件，请运行 bun run db:generate 并提交"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      # 数据层测试跑在进程内的 PGlite（WASM Postgres）上，不需要数据库服务
      - name: Test (Vitest)
        run: bun run test

      # React Router 8 + Vite 8；页面按请求渲染，构建期不连 DB / Redis
      - name: Build
        run: bun run build

  # 浏览器端到端测试：用 compose.prod.yaml 起完整的生产栈（构建出的 Docker 镜像 + Postgres / Redis /
  # SeaweedFS / 迁移 / Caddy），Playwright 经 Caddy 访问 —— 和线上部署走同一条路径
  e2e:
    name: e2e (Docker 生产栈 + Playwright)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f compose.prod.yaml -f .github/ci/compose.e2e.yaml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # 本机只需要 Playwright 和 pg（global setup）；应用本身跑在容器里
      - name: Install
        run: bun install --frozen-lockfile

      - name: Write .env
        run: |
          cat > .env <<'ENV'
          BETTER_AUTH_SECRET=ci-only-e2e-secret-not-used-anywhere-else
          BETTER_AUTH_URL=http://localhost:8099
          SITE_URL=http://localhost:8099
          SEAWEEDFS_SECRET_KEY=ci-only-seaweed-secret
          ENV

      - name: Build image
        run: $COMPOSE build web

      # web 等数据库健康、迁移完成、SeaweedFS 健康后才启动
      - name: Start stack
        run: |
          $COMPOSE up -d
          timeout 180 bash -c 'until curl -sf -o /dev/null http://localhost:8099/robots.txt; do sleep 2; done'

      - name: Seed
        run: $COMPOSE run --rm migrate bash -lc 'bun run --filter @i/db db:seed'

      - name: Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # DATABASE_URL 只在这一步设：放到任务级会被 compose.prod.yaml 的 ${DATABASE_URL:-…} 插值进容器
      - name: E2E
        run: bun run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8099
          # 给 e2e 的 global setup 提权管理员用（compose.e2e.yaml 开放了本机端口）
          DATABASE_URL: postgres://i:i@localhost:5432/i

      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --tail 200

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/e2e/.results
          retention-days: 7
