name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支 / PR 的新推送取消旧的运行
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: lint · typecheck · test · build
    # 本仓库分支的 PR 已经由 push 触发过一次，只给 fork 来的 PR 再跑
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # react-router-hono-server 要求 Node ≥ 24.19；bun 跑 CLI 时会用 PATH 上的 node
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # 读 packageManager 字段，和本地一致

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      # 改了 packages/db/src/schema.ts 却没生成迁移文件时失败（提示运行 bun run db:generate）
      - name: DB migrations up to date
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            git status --porcelain packages/db/drizzle
            echo "::error::schema.ts 有改动但没有对应的迁移文件，请运行 bun run db:generate 并提交"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      # 数据层测试跑在进程内的 PGlite（WASM Postgres）上，不需要数据库服务
      - name: Test (Vitest)
        run: bun run test

      # React Router 8 + Vite 8；页面按请求渲染，构建期不连 DB / Redis
      - name: Build
        run: bun run build
