# Production stack for alice. Built image, no source mounts.
#
#   cp .env.example .env   # set real BETTER_AUTH_SECRET / passwords
#   docker compose -f compose.prod.yaml up -d --build
#
# A bundled nginx is the single entry; it routes same-origin:
#   /  -> web (Hono handles /api/rpc, /api/auth; React Router renders pages + /dash)
# Only the proxy publishes a host port (127.0.0.1); front it with a cf tunnel.

name: iv2-prod

# 对象存储凭据：SeaweedFS 用它建 S3 账号，web / 迁移脚本用它访问。
# 沿用旧 .env 时自动取 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD；新部署设 SEAWEEDFS_*。
# 只用字母数字（会原样写进 SeaweedFS 的 s3.json）。
x-storage-env: &storage-env
  S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-${MINIO_ROOT_USER:-seaweed}}
  S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?set SEAWEEDFS_SECRET_KEY to a strong password}}
  S3_BUCKET: ${S3_BUCKET:-gallery}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-i}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-i}
      POSTGRES_DB: ${POSTGRES_DB:-i}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-i} -d ${POSTGRES_DB:-i}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 对象存储：SeaweedFS 单机（master + volume + filer + S3 网关），只在内部网络可见。
  # 先把凭据写成 s3.json，再交给镜像自带入口（修正 /data 属主、降权到 seaweed 用户）。
  # 卷大小显式设 1GB（二进制默认 30GB，磁盘不大时新桶会分不到卷、上传报 500）。
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    environment:
      <<: *storage-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/seaweedfs/s3.json
        exec /entrypoint.sh server -master.volumeSizeLimitMB=1024 -ip.bind=0.0.0.0 -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port.iceberg=0 -s3.port.lance=0
    volumes:
      - seaweedfs:/data
    restart: unless-stopped
    # S3 网关的 /healthz 在 filer 就绪后才返回 200（冷启动约 20 秒），之后才能建桶 / 写入
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  # ---- 仅用于从 MinIO 迁移旧数据（profile: legacy），用法见 README「存储迁移」 ----
  # 迁移完成并确认图片正常后，可删掉这两个服务和 minio 卷。
  minio:
    profiles: [legacy]
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio:/data

  storage-migrate:
    profiles: [legacy]
    image: oven/bun:1
    working_dir: /app
    command: bash -lc 'bun install --frozen-lockfile && bun packages/db/scripts/migrate-storage.ts'
    environment:
      <<: *storage-env
      S3_ENDPOINT: http://seaweedfs:8333
      SRC_S3_ENDPOINT: http://minio:9000
      SRC_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      SRC_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - ./:/app
      - prod_node_modules:/app/node_modules
    depends_on:
      minio:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    restart: "no"

  # One-shot DB migration. Uses a plain bun image (no app build) — installs deps,
  # applies pending SQL migrations from packages/db/drizzle (no-op when up to date), then exits.
  migrate:
    image: oven/bun:1
    working_dir: /app
    command: >
      bash -lc '
      bun install --frozen-lockfile &&
      bun run --filter @i/db db:migrate'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://i:i@db:5432/i}
    volumes:
      - ./:/app
      - prod_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: iv2-prod-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      tags:
        - iv2-prod-web:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://i:i@db:5432/i}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a real 32+ char secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set the public origin}
      # 公网 origin（RSS / sitemap / 分享卡片的绝对地址）。旧变量名 NEXT_PUBLIC_SITE_URL
      # 仍然认；都没设时退回 BETTER_AUTH_URL（同一个 origin）。
      SITE_URL: ${SITE_URL-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET-}
      # 友链邮件通知 + 反链检测（SMTP_HOST 留空则不发邮件）
      SMTP_HOST: ${SMTP_HOST-}
      SMTP_PORT: ${SMTP_PORT-}
      SMTP_SECURE: ${SMTP_SECURE-}
      SMTP_USER: ${SMTP_USER-}
      SMTP_PASS: ${SMTP_PASS-}
      SMTP_FROM: ${SMTP_FROM-}
      ADMIN_EMAIL: ${ADMIN_EMAIL-}
      FRIEND_NOTIFY_EMAIL: ${FRIEND_NOTIFY_EMAIL-}
      FRIEND_BACKLINK_HOSTS: ${FRIEND_BACKLINK_HOSTS-}
      <<: *storage-env
      # 固定指向内部的 SeaweedFS（旧 .env 里的 S3_ENDPOINT=http://minio:9000 不再生效）
      S3_ENDPOINT: http://seaweedfs:8333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${PROXY_PORT:-8099}:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  seaweedfs:
  # 旧 MinIO 数据：迁移完成前不要删
  minio:
  prod_node_modules:
